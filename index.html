<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>認知訓練</title>
    <meta name="theme-color" content="#f5f0e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="認知遊戲" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/reality.css" />
    <link rel="stylesheet" href="css/food.css" />
    <link rel="stylesheet" href="css/nback.css" />
    <link rel="stylesheet" href="css/dual-nback.css" />
    <link rel="stylesheet" href="css/gng.css" />
    <link rel="stylesheet" href="css/shopping.css" />
    <link rel="stylesheet" href="css/different.css" />
    <link rel="stylesheet" href="css/game-screen.css" />
    <link rel="stylesheet" href="css/pairs.css" />
    <link rel="stylesheet" href="css/unified.css" />
    <script src="js/settings.js"></script>
    <script>try{document.documentElement.setAttribute('data-theme',CognitiveSettingsStore.load(CognitiveSettingsStore.keys.theme).theme==='dark'?'dark':'light');}catch(e){}</script>
</head>
<body>

    <div id="bootLoader" class="boot-loader" role="status" aria-label="Loading">
        <div class="boot-loader-content">
            <img class="boot-loader-brain" src="assets/loader-brain.webp" alt="" aria-hidden="true" draggable="false" />
            <div class="boot-loader-track">
                <div id="bootLoaderProgress" class="boot-loader-progress"></div>
            </div>
        </div>
    </div>

    <!-- ================================================================
        Home
       ================================================================ -->
    <div class="menu-overlay home-overlay menu-overlay--center app-screen" id="home">
        <div class="chrome-btn-right">
            <button class="hamburger-btn" id="homeMenuBtn" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
        </div>
        <div class="menu-header home-header">
            <div class="menu-title"><span class="brain">🧠</span> 認知訓練</div>
        </div>
        <div class="menu-subtitle">選擇一個遊戲</div>
            <div class="home-grid menu-grid menu-cols-4 menu-rows-1">
                <button class="category-btn home-link" data-router-target="realityBoard">
                    <span class="icon">🧭</span>
                    <span class="label">現實導向</span>
                </button>
                <button class="category-btn home-link" data-router-target="mainMenu">
                    <span class="icon">🍽️</span>
                    <span class="label">食物遊戲</span>
                </button>
                <button class="category-btn home-link" data-router-target="nbackModeSelect">
                    <span class="icon">🧩</span>
                    <span class="label">N-back</span>
                </button>
                <button class="category-btn home-link" data-router-target="palm">
                    <span class="icon">👍</span>
                    <span class="label">手掌跳飛機</span>
                </button>
            </div>
        <div class="menu-footer"></div>
    </div>

    <!-- ================================================================
        Reality Orientation
       ================================================================ -->
    <div class="reality-board app-screen" id="realityBoard">
        <div class="reality-top">
            <button class="back-btn" id="realityBackBtn" title="返回上一頁"><img class="back-icon" src="assets/icons/back.png" alt="back" /></button>
            <div class="reality-top-right">
                <button class="action-btn reality-edit-btn" id="realityEditBtn"><span class="reality-edit-emoji" aria-hidden="true">✏️</span></button>
                <button class="hamburger-btn" id="realityMenuBtn" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
            </div>
        </div>

        <div class="reality-stage" id="realityStage">
            <section class="reality-page" data-page="time">
                <div class="reality-time-page">
                    <div class="reality-info">
                        <div class="reality-label">時間</div>
                        <div class="reality-value" id="realityTime">--:-- 上午</div>
                    </div>
                </div>
            </section>
            <section class="reality-page" data-page="date">
                <div class="reality-time-page">
                    <div class="reality-info">
                        <div class="reality-label">日期</div>
                        <div class="reality-value" id="realityDate">----年--月--日（星期--）</div>
                    </div>
                </div>
            </section>
            <section class="reality-page" data-page="season">
                <div class="reality-duo" id="realityDuo">
                    <div class="reality-info reality-season-block">
                        <div class="reality-label">季節</div>
                        <div class="reality-value" id="realitySeasonText">--</div>
                    </div>
                    <div class="reality-info reality-weather-block" id="realityWeatherBlock">
                        <div class="reality-label">天氣</div>
                        <div class="reality-weather-row">
                            <div class="reality-weather-icon" id="realityWeatherIcon" aria-hidden="true"></div>
                            <div class="reality-value" id="realityWeatherText">--</div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="reality-page" data-page="location">
                <div class="reality-info reality-location-block">
                    <div class="reality-label">地點</div>
                    <div class="reality-value" id="realityLocationText">未設定</div>
                </div>
            </section>
        </div>

        <div class="reality-nav">
            <button class="reality-nav-btn" id="realityPrevBtn"><img class="reality-nav-arrow" src="assets/icons/back.png" alt="上一頁" /></button>
            <div class="reality-dots" id="realityDots"></div>
            <button class="reality-nav-btn" id="realityNextBtn"><img class="reality-nav-arrow reality-nav-arrow-flip" src="assets/icons/back.png" alt="下一頁" /></button>
        </div>
    </div>

    <div class="menu-overlay app-screen settings-screen" id="realitySettings">
        <div class="chrome-btn-left">
            <button class="back-btn" id="realitySettingsBackBtn" title="返回上一頁"><img class="back-icon" src="assets/icons/back.png" alt="back" /></button>
        </div>
        <div class="chrome-btn-right">
            <button class="hamburger-btn" id="realitySettingsMenuBtn" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
        </div>
        <div class="menu-header">
            <div class="menu-title">⚙️ 設定</div>
        </div>
        <div class="settings-options" style="width:100%; display:flex; flex-direction:column; padding:calc(10px * var(--ui-scale)) calc(20px * var(--ui-scale));">
            <div style="display:flex; align-items:center; gap:calc(12px * var(--ui-scale)); justify-content:space-between;">
                <span style="font-size:calc(22px * var(--ui-scale)); font-weight:600; color:var(--text-color);">天氣</span>
                <select id="realityWeatherSelect" class="reality-setting-select">
                    <option value="未設定">未設定</option>
                    <option value="晴" selected>晴</option>
                    <option value="陰">陰</option>
                    <option value="雨">雨</option>
                    <option value="雷暴">雷暴</option>
                </select>
            </div>
            <div style="display:flex; align-items:center; gap:calc(12px * var(--ui-scale)); justify-content:space-between;">
                <span style="font-size:calc(22px * var(--ui-scale)); font-weight:600; color:var(--text-color);">季節</span>
                <select id="realitySeasonSelect" class="reality-setting-select">
                    <option value="自動" selected>自動</option>
                    <option value="春天">春天</option>
                    <option value="夏天">夏天</option>
                    <option value="秋天">秋天</option>
                    <option value="冬天">冬天</option>
                </select>
            </div>
            <div style="display:flex; align-items:center; gap:calc(12px * var(--ui-scale)); justify-content:space-between;">
                <span style="font-size:calc(22px * var(--ui-scale)); font-weight:600; color:var(--text-color);">地點</span>
                <select id="realityLocationSelect" class="reality-setting-select">
                    <option value="未設定" selected>未設定</option>
                    <option value="鰂魚涌富璟">鰂魚涌富璟</option>
                    <option value="油塘康璟">油塘康璟</option>
                    <option value="筲箕灣聖輝">筲箕灣聖輝</option>
                    <option value="新蒲崗康璟">新蒲崗康璟</option>
                    <option value="觀塘慶樺">觀塘慶樺</option>
                    <option value="深水埗慶楠">深水埗慶楠</option>
                    <option value="荃灣慶楠">荃灣慶楠</option>
                    <option value="上水慶楠">上水慶楠</option>
                    <option value="沙田富璟">沙田富璟</option>
                    <option value="大埔富樺">大埔富樺</option>
                    <option value="上水富璟">上水富璟</option>
                    <option value="沙田第一城富璟">沙田第一城富璟</option>
                </select>
            </div>
        </div>
            <div class="settings-actions">
                <button id="realityDoneBtn" class="reality-done-btn">確定</button>
            </div>
    </div>

    <!-- ================================================================
        Food game main menu
       ================================================================ -->
    <div class="menu-overlay menu-overlay--center app-screen" id="mainMenu">
        <div class="menu-header">
            <div class="menu-title"><span class="brain">🍽️</span> 食物遊戲</div>
        </div>
        <div class="chrome-btn-left">
            <button class="back-btn" id="foodMainBackBtn" data-app-back="previous" title="返回上一頁"><img class="back-icon" src="assets/icons/back.png" alt="back" /></button>
        </div>
        <div class="chrome-btn-right">
            <button class="hamburger-btn" id="hamburgerBtnHome" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
        </div>
        <div class="menu-subtitle">選擇一個遊戲</div>
            <div class="category-grid game-select menu-grid menu-cols-5 menu-rows-1" id="mainMenuGrid"></div>
        <div class="menu-footer"></div>
    </div>

    <!-- ================================================================
        Food category selector
       ================================================================ -->
    <div class="menu-overlay menu-overlay--center app-screen" id="foodCategorySelect">
        <div class="chrome-btn-left">
            <button class="back-btn" id="foodCategoryBackBtn" title="返回上一頁"><img class="back-icon" src="assets/icons/back.png" alt="back" /></button>
        </div>
        <div class="chrome-btn-right">
            <button class="hamburger-btn" id="hamburgerBtnFoodCategory" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
        </div>
        <div class="menu-header">
            <div class="menu-title">❓ 選擇食物類別</div>
        </div>
        <div class="menu-subtitle" id="foodSubtitle">點擊類別開始挑戰</div>
            <div class="category-grid food-select menu-grid menu-cols-4 menu-rows-2" id="foodCategoryGrid"></div>
    </div>

    <!-- ================================================================
        Food category game
       ================================================================ -->
    <div class="game-container app-screen" id="foodGame">
        <div class="top-bar">
            <div class="left-group">
                <button class="back-btn" id="foodBackBtn" title="返回上一頁"><img class="back-icon" src="assets/icons/back.png" alt="back" /></button>
            </div>
            <div class="question-area">
                <span class="question-text" id="questionText">
                    哪一個是 <span class="category-highlight">水果</span> ？
                </span>
            </div>
            <div class="right-group">
                <div class="score-display" id="foodScoreDisplay">
                    得分&nbsp;<span id="foodScoreNum">0</span>
                </div>
                <div class="dropdown-wrapper">
                    <label for="countSelect">顯示</label>
                    <select id="countSelect">
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <button class="action-btn" id="toggleNamesBtn" title="顯示/隱藏食物名稱">
                    名稱
                    <span class="state-badge on" id="nameBadge"></span>
                </button>
                <span class="separator">|</span>
                <button class="hamburger-btn" id="hamburgerBtnFood" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
            </div>
        </div>

        <div class="grid-wrapper">
            <div class="grid-container cols-3" id="gridContainer"></div>
        </div>

        <div class="footer">
            <span class="hint">💡 點擊圖片選擇答案</span>
            <span class="round-info" id="foodRoundInfo">第 1 題</span>
        </div>
    </div>

    <!-- N-back game (composed through the shared Game Screen) -->
    <div class="game-container app-screen game-screen hidden" id="nbackGame"></div>

    <!-- ================================================================
        N-back mode selection
       ================================================================ -->
    <div class="menu-overlay menu-overlay--center app-screen" id="nbackModeSelect">
        <div class="chrome-btn-left">
            <button class="back-btn" id="nbackModeBackBtn" title="返回上一頁"><img class="back-icon" src="assets/icons/back.png" alt="back" /></button>
        </div>
        <div class="chrome-btn-right">
            <button class="hamburger-btn" id="hamburgerBtnNbackMode" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
        </div>
        <div class="menu-header">
            <div class="menu-title">🧩 N-back</div>
        </div>
        <div class="menu-subtitle">選擇模式</div>
            <div class="category-grid nback-mode-grid menu-grid menu-cols-2 menu-rows-1">
                <button class="category-btn" id="singleNbackBtn">
                    <span class="icon">1️⃣</span>
                    <span class="label">Single N-back</span>
                </button>
                <button class="category-btn" id="dualNbackBtn">
                    <span class="icon">2️⃣</span>
                    <span class="label">Dual N-back</span>
                </button>
            </div>
        <div class="menu-footer"></div>
    </div>

    <!-- ================================================================
        Dual N-back game + settings (composed through the shared Game Screen)
       ================================================================ -->
    <div class="game-container app-screen game-screen hidden" id="dualNbackGame"></div>
    <div class="menu-overlay app-screen settings-screen game-screen hidden" id="dualNbackSettings"></div>

    <!-- ================================================================
        Go/No Go game + settings (composed through the shared Game Screen)
       ================================================================ -->
    <div class="game-container app-screen game-screen hidden" id="gngGame"></div>
    <div class="menu-overlay app-screen settings-screen game-screen hidden" id="gngSettings"></div>


    <!-- ================================================================
        找不同 game
       ================================================================ -->
    <div class="game-container app-screen game-screen hidden" id="differentGame"></div>

    <!-- ================================================================
        Shopping memory game (composed through the shared Game Screen)
       ================================================================ -->
    <div class="game-container app-screen game-screen hidden" id="shoppingGame"></div>
    <div class="menu-overlay app-screen settings-screen game-screen hidden" id="shoppingSettings"></div>

    <!-- ================================================================
        Memory pairs screens
       ================================================================ -->
    <div class="menu-overlay app-screen settings-screen game-screen hidden" id="pairsSettings"></div>
    <div class="game-container app-screen game-screen hidden" id="pairsGame"></div>

    <!-- ================================================================
        手掌跳飛機
       ================================================================ -->
    <div class="game-container app-screen" id="palm">
        <div class="top-bar">
            <div class="left-group">
                <button class="back-btn" id="palmBackBtn" data-app-back="previous" title="返回上一頁"><img class="back-icon" src="assets/icons/back.png" alt="back" /></button>
            </div>
            <div class="right-group">
                <div class="dropdown-wrapper">
                    <label for="difficultySelect">手勢</label>
                    <select id="difficultySelect">
                        <option value="easy">包剪揼</option>
                        <option value="hard" selected>全部</option>
                    </select>
                </div>
                <div class="dropdown-wrapper">
                    <label for="handSelect">正反手</label>
                    <select id="handSelect">
                        <option value="both" selected>正反手</option>
                        <option value="palmar">正手</option>
                    </select>
                </div>
                <button class="hamburger-btn" id="palmMenuBtn" title="開啟選單"><img class="menu-icon" src="assets/icons/menu.png" alt="menu" /></button>
            </div>
        </div>

        <div class="grid-wrapper">
            <div class="game-board">
                <div class="side" id="leftSide">
                    <div id="leftGesture" class="gesture-image"></div>
                </div>
                <div class="side" id="rightSide">
                    <div id="rightGesture" class="gesture-image"></div>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="left-group">
                <div class="speed-control">
                    <button class="speed-btn" id="speedDown" title="減慢速度" aria-label="減慢速度">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
                    </button>
                    <span class="speed-display" id="speedDisplay">5</span>
                    <button class="speed-btn" id="speedUp" title="加快速度" aria-label="加快速度">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
                <button class="play-btn" id="playBtn" title="自動播放">
                    <span class="play-icon">
                        <span class="triangle"></span>
                        <span class="pause-bar left"></span>
                        <span class="pause-bar right"></span>
                    </span>
                </button>
            </div>
            <div class="center-group palm-controls">
                <button id="swapBtn" title="交換左右手勢">
                    <span id="swapSymbol">交換</span>
                </button>
            </div>
            <div class="right-group"></div>
        </div>
    </div>

    <!-- ================================================================
        Shared overlays and side menu
       ================================================================ -->
    <div class="overlay" id="overlay">
        <div class="message-box" id="messageBox">
            <span class="msg-icon" id="msgIcon">✅</span>
            <div class="msg-text" id="msgText">正確</div>
            <div class="msg-sub" id="msgSub">太棒了！</div>
            <div id="msgButtons"></div>
        </div>
    </div>

    <div class="overlay" id="magnifyOverlay">
        <div class="magnify-box" onclick="event.stopPropagation();">
            <button class="close-btn" id="magnifyCloseBtn">✕</button>
            <div class="image-wrapper">
                <img id="magnifyImage" src="" alt="放大圖片" />
            </div>
            <div class="food-name" id="magnifyName"></div>
        </div>
    </div>

    <div class="slide-menu" id="slideMenu">
        <div class="menu-item" id="slideThemeBtn">
            🌑 深色模式
            <span class="state-badge" id="themeBadge"></span>
        </div>
        <div class="menu-item" id="slideBgMusicBtn">
            🔊 背景音樂
            <span class="state-badge on" id="bgMusicBadge"></span>
        </div>
        <div class="menu-item" id="slideSfxBtn">
            🔊 音效
            <span class="state-badge on" id="sfxBadge"></span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="slideHelpBtn">⌨️ 鍵盤操作</div>
        <div class="menu-item" id="slideHomeBtn">🏠 回到主頁</div>
    </div>

    <div class="slide-menu-backdrop" id="slideMenuBackdrop"></div>

    <div class="portrait-lock" id="portraitLock" aria-hidden="true">
        <div class="portrait-lock-content">
            <div class="portrait-lock-icon" aria-hidden="true">⟲</div>
            <div class="portrait-lock-title">請將裝置橫放</div>
            <div class="portrait-lock-sub">轉為橫向後繼續</div>
        </div>
    </div>

    <audio id="appBgAudio" src="assets/audio/background.mp3" loop preload="auto"></audio>

    <script src="js/food/audio.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app-chrome.js"></script>
    <script src="js/game-registry.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/settings-layout.js"></script>
    <script src="js/reality.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/session.js"></script>
    <script src="js/palm.js"></script>
    <script src="js/food/food-data.js"></script>
    <script src="js/food/prefs.js"></script>
    <script src="js/food/message.js"></script>
    <script src="js/food/ui.js"></script>
    <script src="js/food/name-visibility.js"></script>
    <script src="js/food/food-logic.js"></script>
    <script src="js/food/food-view.js"></script>
    <script src="js/food/sequence.js"></script>
    <script src="js/game-screen.js"></script>
    <script src="js/food/nback-view.js"></script>
    <script src="js/food/nback-screen.js"></script>
    <script src="js/food/nback.js"></script>
    <script src="js/food/nback-audio-map.js"></script>
    <script src="js/food/dual-nback-logic.js"></script>
    <script src="js/food/dual-nback-view.js"></script>
    <script src="js/food/gng-logic.js"></script>
    <script src="js/food/gng-view.js"></script>
    <script src="js/food/dual-nback-screen.js"></script>
    <script src="js/food/dual-nback.js"></script>
    <script src="js/food/gng-screen.js"></script>
    <script src="js/food/gng.js"></script>
    <script src="js/food/food-screen.js"></script>
    <script src="js/food/food.js"></script>
    <script src="js/food/different-view.js"></script>
    <script src="js/food/different.js"></script>
    <script src="js/food/pairs-logic.js"></script>
    <script src="js/food/pairs-settings.js"></script>
    <script src="js/food/pairs-view.js"></script>
    <script src="js/food/pairs.js"></script>
    <script src="js/food/shopping-logic.js"></script>
    <script src="js/food/shopping-screen.js"></script>
    <script src="js/food/shopping-view.js"></script>
    <script src="js/food/shopping.js"></script>
    <script src="js/food/main.js"></script>
    <script src="js/update-flow.js"></script>
    <script src="js/boot.js"></script>
    <script>
        (function () {
            'use strict';
            var homeTiles = document.querySelectorAll('[data-router-target]');
            for (var i = 0; i < homeTiles.length; i++) {
                homeTiles[i].addEventListener('click', function () {
                    var target = this.getAttribute('data-router-target');
                    if (window.CognitiveRouter) {
                        window.CognitiveRouter.navigate(target);
                    }
                });
            }
            window.CognitiveBoot.start(function () {
                window.CognitiveRouter.initialize('home');
            });
        })();
    </script>
</body>
</html>
